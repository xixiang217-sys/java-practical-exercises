<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url('./bg/bg2.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .tb2{
             margin: 0 auto;




        }
        .td2 {
               height: 40px;
            width: 200px;
          

        }
      
    
        .tb1 {
            margin: 0 auto;
            border: 1px solid black;
           
        }
        .td1 {
            height: 100px;
            width: 400px;
            text-align: center;
           
           
        }
        .sz {
             height: 40px;
            width: 200px;
             background-color: rgb(226, 238, 238);

        }
        #color1 {
               height: 40px;
            width: 300px;
        }
         #color2 {
           height: 40px;
            width: 300px;
        }
         #color3 {
             height: 40px;
            width: 300px;
        }
         #color4 {
              height: 40px;
            width: 300px;
        }
         #color5 {
              height: 40px;
            width: 300px;
        }
         #color6{
            height: 40px;
            width: 300px;
        }
         #color7{
             height: 40px;
            width: 300px;
        }
         #color8 {
             height: 40px;
            width: 300px;
        }
         #color9 {
            height: 40px;
            width: 300px;
        }
         #color10{
               height: 40px;
            width: 300px;
        }

    </style>
</head>
<body>


    <table class="tb1">
        <tr>
            <td class="td1">
                <input type="text" id="color1">

            </td>
             <td class="td1">
                <input type="text" id="color2">

             </td>
        </tr>
        <tr>
            <td class="td1">
                <input type="text" id="color3">
            </td>
             <td class="td1">
                <input type="text" id="color4">
             </td>
        </tr>
        <tr>
             <td class="td1">
                <input type="text" id="color5">
             </td>
             <td class="td1">
                <input type="text" id="color6">
             </td>
        </tr>
        <tr>
             <td class="td1">
                <input type="text" id="color7">
             </td>
             <td class="td1">
                <input type="text" id="color8">
             </td>
        </tr>
        <tr>
             <td class="td1">
                <input type="text" id="color9">
             </td>
             <td class="td1">
                <input type="text" id="color10">
             </td>
        </tr>
    </table>
    <table class="tb2">
        <tr>
            <td class="td2">
                <input type="button" class="sz" id="sz1" value="设置颜色">
            </td>
            <td class="td2">
                <input type="button" class="sz" id="sz2" value="显示颜色">
            </td>
            <td class="td2">
                <input type="button" class="sz" id="sz3" value="颜色排序">
            </td>
        </tr>
    </table>

    <script>
        var c1=document.getElementById("color1");
        var c2=document.getElementById("color2");
        var c3=document.getElementById("color3");
        var c4=document.getElementById("color4");
        var c5=document.getElementById("color5");
        var c6=document.getElementById("color6");
        var c7=document.getElementById("color7");
        var c8=document.getElementById("color8");
        var c9=document.getElementById("color9");
        var c10=document.getElementById("color10");

        // b) 创建长度为5的数组，名字为 myColor
        var myColor = new Array(5);

        // 左列5个文本框（显示原始顺序），右列5个文本框（显示降序结果）
        var leftInputs = [c1, c3, c5, c7, c9];
        var rightInputs = [c2, c4, c6, c8, c10];

        // c) 设置颜色：利用循环依次弹出5个提示框，把颜色单词存入 myColor 数组
        var s1 = document.getElementById("sz1");
        s1.onclick = function () {
            for (var i = 0; i < myColor.length; i++) {
                myColor[i] = prompt("输入第" + (i + 1) + "个颜色单词(共5个)");
            }
        }

        // d) 显示颜色：把数组内容依次显示在左列文本框，并弹出用 & 连接的所有颜色
        var s2 = document.getElementById("sz2");
        s2.onclick = function () {
            for (var i = 0; i < leftInputs.length; i++) {
                leftInputs[i].value = myColor[i];
            }
            alert("您输入的颜色有" + myColor.join("&"));
        }

        // e) 颜色排序：按降序排序后，依次显示在右列文本框（复制一份排序，不改动原数组）
        var s3 = document.getElementById("sz3");
        s3.onclick = function () {
            var sorted = [];
            for (var i = 0; i < myColor.length; i++) {
                sorted[i] = myColor[i];
            }
            sorted.sort();      // 先按字母升序
            sorted.reverse();   // 再反转得到降序
            for (var i = 0; i < rightInputs.length; i++) {
                rightInputs[i].value = sorted[i];
            }
        }


        
        
        

        
       
    </script>



    
</body>
</html>
